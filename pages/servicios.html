<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TALLER MECANICO - SERVICIOS</title>
    <meta name="description" content="Descubre los servicios que ofrecemos en nuestro taller mecánico, incluyendo service completo, chapería y pintura, tren delantero y mecánica general.">
    <meta name="keywords" content="taller mecánico en rosario, servicios automotrices, service completo, chapería y pintura, tren delantero, mecánica general">

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

    <!-- CSS propio -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Animaciones AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <!-- Logo -->
                <a class="navbar-brand" href="../index.html">
                    <img src="../img/logo.jpeg" alt="Logo del taller">
                </a>

                <!-- Botón hamburguesa -->
                <button class="navbar-toggler hamburguesa"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup"
                    aria-controls="navbarNavAltMarkup"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                    ≡

                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

                    <div class="navbar-nav ms-auto">

                        <a class="nav-link link-menu" href="../index.html">
                            INICIO
                        </a>

                        <a class="nav-link link-menu" href="#">
                            SERVICIOS
                        </a>

                        <a class="nav-link link-menu" href="../pages/nosotros.html">
                            NOSOTROS
                        </a>

                        <a class="nav-link link-menu" href="../pages/contacto.html">
                            CONTACTO
                        </a>

                        <a class="nav-link link-menu" href="../pages/historia.html">
                            HISTORIA
                        </a>

                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main>

        <h1>SERVICIOS</h1>

        <section class="tarjetas">

            <!-- Service completo -->
            <div data-aos="fade-up" data-aos-duration="1500">

                <figure class="tarjeta">

                    <h2>Service completo</h2>

                    <img src="../img/service.jfif"
                        alt="Service completo">

                    <figcaption>
                        Service completo para el mantenimiento de tu vehículo.
                    </figcaption>

                </figure>

            </div>

            <!-- Chapería y pintura -->
            <div data-aos="fade-up" data-aos-duration="1700">

                <figure class="tarjeta">

                    <h2>Chapería y pintura</h2>

                    <img src="../img/chaperiaypintura.jfif"
                        alt="Trabajo de chapería y pintura">

                    <figcaption>
                        Reparación de carrocería y trabajos de pintura.
                    </figcaption>

                </figure>

            </div>

            <!-- Tren delantero -->
            <div data-aos="fade-up" data-aos-duration="1900">

                <figure class="tarjeta">

                    <h2>Tren delantero</h2>

                    <img src="../img/trendelantero.jfif"
                        alt="Reparación del tren delantero">

                    <figcaption>
                        Revisión y reparación del tren delantero.
                    </figcaption>

                </figure>

            </div>

            <!-- Mecánica general -->
            <div data-aos="fade-up" data-aos-duration="2100">

                <figure class="tarjeta">

                    <h2>Mecánica general</h2>

                    <img src="../img/mecanicageneral.jfif"
                        alt="Trabajo de mecánica general">

                    <figcaption>
                        Diagnóstico y reparación de mecánica general.
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>

    <footer>

        <h2>Todos los derechos reservados</h2>

        <ul>

            <li>
                <img src="../img/facebook.jfif" alt="Facebook">
                <a href="https://www.facebook.com">FACEBOOK</a>
            </li>

            <li>
                <img src="../img/instagram.jfif" alt="Instagram">
                <a href="https://www.instagram.com">INSTAGRAM</a>
            </li>

            <li>
                <img src="../img/X.png" alt="X">
                <a href="https://www.x.com">X</a>
            </li>

        </ul>

    </footer>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous">
    </script>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init();
    </script>
