<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Taller Integral Multimarca</title>

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

    <!-- CSS propio -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- HEADER -->
    <header>

        <nav class="navbar navbar-expand-lg">

            <div class="container-fluid">

                <!-- Logo -->
                <a class="navbar-brand" href="../index.html">
                    <img src="../img/logo.jpeg"
                        alt="Logo del taller">
                </a>

                <!-- Botón hamburguesa -->
                <button class="navbar-toggler hamburguesa"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup"
                    aria-controls="navbarNavAltMarkup"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                    ☰

                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse"
                    id="navbarNavAltMarkup">

                    <div class="navbar-nav ms-auto">

                        <a class="nav-link link-menu"
                            href="../index.html">
                            INICIO
                        </a>

                        <a class="nav-link link-menu"
                            href="./servicios.html">
                            SERVICIOS
                        </a>

                        <a class="nav-link link-menu"
                            href="./nosotros.html">
                            NOSOTROS
                        </a>

                        <a class="nav-link link-menu"
                            href="./contacto.html"
                            aria-current="page">
                            CONTACTO
                        </a>

                        <a class="nav-link link-menu"
                            href="./historia.html">
                            HISTORIA
                        </a>

                    </div>

                </div>

            </div>

        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <h1>CONTACTANOS</h1>

        <section class="contacto">

            <!-- FORMULARIO -->
            <form action="#">

                <fieldset>

                    <legend>Información personal</legend>

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>


                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required>


                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required>


                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono">


                    <label for="comentarios">
                        Comentarios
                    </label>

                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="5"
                        placeholder="Escribe tus comentarios aquí..."></textarea>

                </fieldset>

                <button type="submit">
                    ENVIAR
                </button>

            </form>


            <!-- MAPA -->
            <div class="mapa">

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3348.3193451345905!2d-60.67392892531067!3d-32.94257717168133!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95b7abb2628eeb75%3A0x2182cede19a5059e!2sTALLER%20MEC%C3%81NICO%20-%20SERVICIOS%20TERRITORIALES%20SRL!5e0!3m2!1ses-419!2sar!4v1788436878125!5m2!1ses-419!2sar"
                    allowfullscreen
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <h2>Todos los derechos reservados</h2>

        <ul>

            <li>
                <img src="../img/facebook.jfif"
                    alt="Facebook">

                <a href="https://www.facebook.com">
                    FACEBOOK
                </a>
            </li>

            <li>
                <img src="../img/instagram.jfif"
                    alt="Instagram">

                <a href="https://www.instagram.com">
                    INSTAGRAM
                </a>
            </li>

            <li>
                <img src="../img/X.png"
                    alt="X">

                <a href="https://www.x.com">
                    X
                </a>
            </li>

        </ul>

    </footer>


    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
